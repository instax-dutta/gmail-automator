# Publishes a GitHub release and the sdist/wheel to PyPI when a version tag is pushed.
#
# Authentication is PyPI "trusted publishing" (OIDC), so there is no long-lived secret in this
# repository. The workflow fails closed: it refuses to run from a fork's tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # The tag must be the commit CI already blessed, and its version must match pyproject.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m "not e2e and not postgres"
      - run: uv run pytest -m e2e
      - name: Fail if the tag does not match the package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $pkg_version" >&2
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the sdist and wheel
        run: |
          uv build
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: github.repository == 'instax-dutta/gmail-automator'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # the OIDC token PyPI trusted publishing exchanges for an upload token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    if: github.repository == 'instax-dutta/gmail-automator'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Check the tag is annotated or reachable
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" dist/*
      - run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
