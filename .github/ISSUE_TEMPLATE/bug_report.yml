name: Bug report

description: Something does not work as documented.

labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. The most useful details are the exact command or request, the
        configuration, and the log output.

        **Redact before pasting:** `FMAIILY_TOKEN_ENCRYPTION_KEY`, `FMAIILY_BOOTSTRAP_ADMIN_KEY`,
        any `fmg_...` API key, and any OAuth refresh token. A leaked encryption key unlocks every
        stored credential - rotate it if you paste one by accident.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I ran `fmaiily send-test someone@example.com` and expected a message id.
        Instead the job failed with `daily_send_quota_exceeded` on a fresh account.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The shortest path from a clean state to the failure.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Fmaiily version
      placeholder: "0.1.0, or a commit SHA"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you running it
      options:
        - Docker Compose
        - Docker directly
        - From a checkout (uv)
        - Installed as a package (pip/uvx)
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite
        - PostgreSQL
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - REST API
        - MCP (Streamable HTTP)
        - MCP (stdio)
        - CLI
        - Worker
        - Status page or metrics
        - Startup or migrations
        - Unsure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Output of the failing command, with `FMAIILY_LOG_LEVEL=DEBUG` if it helps. Redact secrets.
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: The `FMAIILY_*` variables in play. Values may be redacted, but keep the shape.
      render: dotenv
