[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmaiily"
version = "0.1.0"
description = "Self-hosted Gmail gateway for AI agents (MCP + REST)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "email-validator>=2.3,<3",
  "sqlalchemy>=2.1,<3",
  "alembic>=1.20,<2",
  "cryptography>=50,<51",
  "google-api-python-client>=2.200,<3",
  "google-auth>=2.58,<3",
  "mcp>=2.2,<3",
  "httpx>=0.28,<1",
  "typer>=0.27,<1",
  "structlog>=26.1,<27",
  "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "anyio>=4.6",
  "time-machine>=3.5,<4",
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
]

[project.scripts]
fmaiily = "fmaiily.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fmaiily"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "e2e: end-to-end tests (opt-in, may bind local ports)",
  "postgres: requires FMAIILY_TEST_POSTGRES_URL",
]

[tool.coverage.run]
source = ["fmaiily"]
branch = true
omit = ["src/fmaiily/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI/Typer Depends()/Option() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true
